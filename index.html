<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yardsales-Made-EZ</title>
  
  <!-- PWA & Mobile Settings -->
  <meta name="theme-color" content="#2563eb" />
  <link rel="manifest" href="manifest.json" />

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --border: #e2e8f0;
      --success: #16a34a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 70px; }

    header {
      background: var(--primary);
      color: white;
      padding: 1rem;
      text-align: center;
      font-weight: bold;
      font-size: 1.2rem;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    /* Bottom Navigation Tabs */
    nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: white;
      display: flex;
      border-top: 1px solid var(--border);
      z-index: 1000;
    }

    .nav-btn {
      flex: 1;
      padding: 0.75rem 0;
      border: none;
      background: none;
      font-size: 0.85rem;
      font-weight: 600;
      color: #64748b;
      cursor: pointer;
    }

    .nav-btn.active {
      color: var(--primary);
      border-top: 3px solid var(--primary);
    }

    /* Views */
    .view { display: none; padding: 1rem; }
    .view.active { display: block; }

    /* Cards & Forms */
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
    input, select, button { width: 100%; padding: 0.75rem; margin-top: 0.5rem; border-radius: 6px; border: 1px solid var(--border); font-size: 1rem; }
    button.btn-primary { background: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer; }
    button.btn-success { background: var(--success); color: white; border: none; font-weight: bold; cursor: pointer; }

    /* POS Layout */
    .item-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 0.5rem; margin-bottom: 1rem; }
    .item-tile { background: white; border: 1px solid var(--border); border-radius: 6px; padding: 0.75rem; text-align: center; cursor: pointer; }
    .item-tile.sold { opacity: 0.5; pointer-events: none; text-decoration: line-through; }
    
    /* Map Layout */
    #map { height: 60vh; width: 100%; border-radius: 8px; border: 1px solid var(--border); }
  </style>
</head>
<body>

  <header>Yardsales-Made-EZ</header>

  <!-- VIEW 1: POS / CHECKOUT -->
  <section id="pos-view" class="view active">
    <h2>Point of Sale</h2>
    <p style="font-size: 0.9rem; color: #64748b; margin-bottom: 1rem;">Tap available items to add to cart.</p>
    
    <div id="pos-items" class="item-grid"></div>

    <div class="card">
      <h3>Current Cart</h3>
      <div id="cart-list" style="margin: 0.5rem 0;">No items selected.</div>
      <p style="font-size: 1.2rem; font-weight: bold;">Total: $<span id="cart-total">0.00</span></p>
      
      <label style="margin-top: 1rem; display: block;">Payment Method:</label>
      <select id="payment-method">
        <option value="Cash">Cash</option>
        <option value="Venmo">Venmo</option>
        <option value="CashApp">CashApp</option>
      </select>

      <button class="btn-success" style="margin-top: 1rem;" onclick="checkout()">Complete Sale</button>
    </div>
  </section>

  <!-- VIEW 2: MAP & ROUTE -->
  <section id="map-view" class="view">
    <h2>Nearby Sales & Route</h2>
    <div id="map" style="margin-top: 1rem;"></div>
  </section>

  <!-- VIEW 3: INVENTORY MANAGEMENT -->
  <section id="inventory-view" class="view">
    <h2>Inventory</h2>
    <div class="card">
      <h3>Add Item</h3>
      <input type="text" id="item-name" placeholder="Item Name (e.g., Circular Saw)" />
      <input type="number" id="item-price" placeholder="Price ($)" step="0.01" />
      <button class="btn-primary" onclick="addItem()">Add to Listing</button>
    </div>

    <div class="card">
      <h3>Item List</h3>
      <div id="inventory-list"></div>
    </div>
  </section>

  <!-- NAVIGATION -->
  <nav>
    <button class="nav-btn active" onclick="switchTab('pos-view', this)">🛒 POS</button>
    <button class="nav-btn" onclick="switchTab('map-view', this)">🗺️ Map</button>
    <button class="nav-btn" onclick="switchTab('inventory-view', this)">📦 Inventory</button>
  </nav>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // App State
    let items = JSON.parse(localStorage.getItem('ys_items')) || [
      { id: 1, name: 'Tool Box', price: 15.00, sold: false },
      { id: 2, name: 'Lawn Mower', price: 45.00, sold: false }
    ];
    let cart = [];
    let mapInitialized = false;
    let map;

    // Save State
    function saveData() {
      localStorage.setItem('ys_items', JSON.stringify(items));
      renderPOS();
      renderInventory();
    }

    // Navigation Logic
    function switchTab(viewId, btn) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      
      document.getElementById(viewId).classList.add('active');
      btn.classList.add('active');

      if (viewId === 'map-view' && !mapInitialized) {
        initMap();
      }
    }

    // POS Functions
    function renderPOS() {
      const posContainer = document.getElementById('pos-items');
      posContainer.innerHTML = '';
      items.forEach(item => {
        const div = document.createElement('div');
        div.className = `item-tile ${item.sold ? 'sold' : ''}`;
        div.innerHTML = `<strong>${item.name}</strong><br>$${item.price.toFixed(2)}`;
        div.onclick = () => addToCart(item);
        posContainer.appendChild(div);
      });
    }

    function addToCart(item) {
      if (item.sold || cart.find(c => c.id === item.id)) return;
      cart.push(item);
      renderCart();
    }

    function renderCart() {
      const cartContainer = document.getElementById('cart-list');
      if (cart.length === 0) {
        cartContainer.innerHTML = 'No items selected.';
        document.getElementById('cart-total').innerText = '0.00';
        return;
      }
      cartContainer.innerHTML = cart.map(i => `<div>${i.name} - $${i.price.toFixed(2)}</div>`).join('');
      const total = cart.reduce((sum, i) => sum + i.price, 0);
      document.getElementById('cart-total').innerText = total.toFixed(2);
    }

    function checkout() {
      if (cart.length === 0) return alert('Cart is empty!');
      const method = document.getElementById('payment-method').value;
      cart.forEach(cartItem => {
        const item = items.find(i => i.id === cartItem.id);
        if (item) item.sold = true;
      });
      alert(`Sale completed via ${method}!`);
      cart = [];
      renderCart();
      saveData();
    }

    // Inventory Functions
    function addItem() {
      const name = document.getElementById('item-name').value;
      const price = parseFloat(document.getElementById('item-price').value);
      if (!name || isNaN(price)) return alert('Enter valid name and price');

      items.push({ id: Date.now(), name, price, sold: false });
      document.getElementById('item-name').value = '';
      document.getElementById('item-price').value = '';
      saveData();
    }

    function renderInventory() {
      const container = document.getElementById('inventory-list');
      container.innerHTML = items.map(i => `
        <div style="display:flex; justify-content:space-between; padding: 0.5rem 0; border-bottom: 1px solid #e2e8f0;">
          <span>${i.name} (${i.sold ? '<strong>SOLD</strong>' : 'Available'})</span>
          <span>$${i.price.toFixed(2)}</span>
        </div>
      `).join('');
    }

    // Map Functions
    function initMap() {
      mapInitialized = true;
      // Default center: Lowell, MA area (42.6334, -71.3162)
      map = L.map('map').setView([42.6334, -71.3162], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
      }).addTo(map);

      // Example sale location marker
      L.marker([42.6334, -71.3162]).addTo(map)
        .bindPopup('<b>Active Yard Sale</b><br>123 Main St<br>Tools, Furniture, Electronics')
        .openPopup();
    }

    // Service Worker Registration for PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration failed:', err));
      });
    }

    // Initial Render
    renderPOS();
    renderInventory();
  </script>
</body>
</html>
